<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code Extensions Catalog</title>
<meta name="description" content="Searchable catalog of Claude Code plugins, skills, agents and marketplaces on GitHub, with trust tiers, license groups and star trends.">
<meta name="color-scheme" content="light dark">
<!--
  Local testing: star history is lazy-loaded with fetch() from history/NN.json, which browsers
  block over file://. The page works from file:// (without history); for the full experience run
      python -m http.server -d site
  and open http://localhost:8000
-->
<script>try{var t=localStorage.getItem("cc-theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%23116d78%22/%3E%3Ctext x=%2216%22 y=%2221%22 font-family=%22monospace%22 font-size=%2214%22 font-weight=%22700%22 fill=%22white%22 text-anchor=%22middle%22%3Ecc%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body data-view="table">
<nav class="skip" aria-label="Skip links"><a href="#q" data-act="skip">Skip to search</a><a href="#results" data-act="skip">Skip to results</a><a href="#side" data-act="skip">Skip to filters</a></nav>
<div class="app">
  <aside class="side" id="side" aria-label="Filters" tabindex="-1"></aside>
  <main class="main">
    <header class="top" id="top">
      <button class="btn icon only-narrow" type="button" data-act="drawer" aria-label="Show filters" aria-controls="side" aria-expanded="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg></button>
      <div class="search" role="search">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m20 20-4.2-4.2"/><circle cx="11" cy="11" r="6.5"/></svg>
        <label class="sr" for="q">Search extensions</label>
        <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search extensions" title="Searches names, descriptions, tags and items" aria-keyshortcuts="/">
        <kbd aria-hidden="true">/</kbd>
      </div>
      <span class="count" id="count" aria-live="polite"></span>
      <span class="spacer"></span>
      <div class="seg" role="group" aria-label="View">
        <button type="button" data-act="view" data-v="table" aria-pressed="true"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>Table</span></button>
        <button type="button" data-act="view" data-v="cards" aria-pressed="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg><span>Cards</span></button>
      </div>
      <button class="btn icon" type="button" id="theme" data-act="theme" aria-label="Toggle dark mode"></button>
    </header>
    <div id="presets" class="presets" role="group" aria-label="Quick views"></div>
    <div id="chips" class="chips" aria-label="Active filters"></div>
    <div id="assist" class="assist" aria-live="polite"></div>
    <div id="resbar" class="resbar"></div>
    <div id="results" tabindex="-1">
      <div class="tablewrap" id="tableview">
        <table class="grid" aria-label="Extensions" aria-describedby="count">
          <thead><tr id="thead"></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="cards" id="cardview" role="list" aria-label="Extensions" hidden></div>
      <div class="sentinel" id="sentinel" aria-hidden="true"></div>
      <div class="loadmore" id="loadmore"></div>
    </div>
  </main>
</div>
<div class="tipbox" id="tipbox" role="tooltip" hidden></div>
<noscript><p class="empty"><b>This catalog needs JavaScript.</b>The raw data is in catalog.js.</p></noscript>
<script src="catalog.js"></script>
<script src="app.js"></script>
</body>
</html>
